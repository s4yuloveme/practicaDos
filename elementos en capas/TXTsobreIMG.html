<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto sobre imagen</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/icono1.png">
    <style>
        .container {
            position: relative;
        }

        .topleft {
            position: absolute;
            top: 8px;
            left: 16px;
            font-size: 18px;
        }

        .topright {
            position: absolute;
            top: 8px;
            right: 16px;
            font-size: 18px;
        }

        .bottomleft {
            position: absolute;
            bottom: 8px;
            left: 16px;
            font-size: 18px;
        }
        .bottomright {
            position: absolute;
            bottom: 8px;
            right: 16px;
            font-size: 18px;
        }

        .center {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            text-align: center;
            font-size: 18px;
        }
        img {
            width: 100%;
            height: auto;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <h2>Texto sobre Imagen</h2>
    <p>Colocando texto en distintas posiciones sobre una im&aacute;gen:</p>

    <div class="container">
        <img src="img/mapachihuahua.jpg" alt="mapachihuahua" width="1000" height="417">
        <div class="topleft">Superior Izquierdo</div>
        <div class="topright">Superior Derecha</div>
        <div class="bottomleft">Inferior izquierda</div>
        <div class="bottomright">Inferior Derecha</div>
        <div class="center">Centrado</div>
    </div>
    
</body>
</html>
