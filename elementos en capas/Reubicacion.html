<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reubicación</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/icono1.png">
    <style>
        div {
            width: 300px;
            height: 100px;
            background-color: cyan;
            border: 3px solid black;
            transform: translate(50px,100px);
        }
    </style>
</head>
<body>
    <h2>Reubicando un DIV</h2>
    <p>Se puede transformar la posici&oacute;n de un DIV con el m&eacute;todo de trasladar:</p>

    <div>
        El m&eacute;todo translate() altera la posici&oacute;n original de un elemento.
        El elemento DIV que se muestra aqu&iacute;, est&aacute; movido 50 pixeles a la derecha
        y 100 pixeles hacia abajo, a partir de su posici&oacute;n original.
    </div>
    
</body>
</html>
