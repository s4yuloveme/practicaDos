<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static DIV</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/icono.jpg">
    <style>
        div.estatico {
            position: static;
            border: 3px solid green;
        }
    </style>
</head>
<body>
    <h2>Posici&oacute;n del DIV: static</h2>
    <p>Un elemento con posici&oacute;n est&aacute;tica no se ubica de ninguna forma
        especial, se ubica siempre seg&uacute;n el flujo normal de la p&aacute;gina.</p>

        <div class="estatico">
            <p>Este elemento DIV tiene asignada la posición: <b><i>static;</i></b></p>
        </div>
    
</body>
</html>
