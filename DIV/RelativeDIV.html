<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative DIV</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/icono.jpg">
    <style>
        div.relativo{
            position: relative;
            left: 30px;
            border: 5px solid red;
        }
    </style>
</head>
<body>
    <h2>Posici&oacute;n del DIV: relative;</h2>

    <p>Un elemento con posici&oacute;n relativa se puede ubicar de manera relativa
        a su posici&oacute;n original, y se puede modificar su ubicaci&oacute;n desde CSS</p>

        <div class="relativo">
            <p>Este elemento DIV tiene asignada la posici&oacute;n: <b><i>relative;</i></b></p>
        </div>
    
</body>
</html>
