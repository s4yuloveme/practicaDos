<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de span</title>
    <link rel="icon" type="image/gif/png/jpg" href="img/icono1.png">
    <style type="text/css">
        .tipos_fruta{
            color:blueviolet;
            font-size: 150%;
            text-decoration: underline;
        }
        .ejemplo_fruta{
            color: blue;
            font-size: 150%;
        }
    </style>
</head>
<body>
    <h2>Usando SPAN para dar formato a texto con CSS</h2>
    <p>
        <span class="tipos_fruta">Frutas con hueso:</span>
        <span class="ejemplo_fruta">Ciruela</span>
        <span class="ejemplo_fruta">Aguacate</span>
        <span class="ejemplo_fruta">Durazno</span>
        <span class="ejemplo_fruta">Rambutan</span>
    </p>
    <p>
        <span class="tipos_fruta">Frutas con semilla:</span>
        <span class="ejemplo_fruta">Guayaba</span>
        <span class="ejemplo_fruta">Sandía</span>
        <span class="ejemplo_fruta">Kiwi</span>
        <span class="ejemplo_fruta">Uva</span>
    </p>

    
    
</body>
</html>
